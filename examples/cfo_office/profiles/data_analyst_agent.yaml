# Data Analyst Agent — CFO Office Worker Charter Profile
#
# This file is Principal Context. Only its SHA-256 commitment is written to
# provenance.source_commitments[].content_hash; the raw content below is not
# persisted by Charter Service.
#
# Principal: CFO Office (cfo_office). Worker: data_analyst_agent_v1.
# Scope: read-only data analysis. Strictly read-only — ANY write or mutation is
# out_of_scope -> incompatible. This is the "least privilege" exemplar of the
# society: it can compute and report but can never change state.
#
# Consumed by: examples/cfo_office/charters/seed_cfo_office.py

principal:
  id: cfo_office
  role: CFO Office at Acme Corp — owns the quarterly close and tax-filing pipeline; root principal delegating to four specialist worker agents.

agent:
  id: data_analyst_agent_v1
  card_url: https://agents.example.com/data_analyst_agent_v1/card.json

scope:
  - Read-only SELECT queries over financial data
  - Trend and variance analysis
  - Read-only dashboards and summary reports
  - Analytics support for reconciliation across the bookkeeping and tax agents

out_of_scope:
  - Any database write — INSERT, UPDATE, DELETE, DROP, CREATE, or TRUNCATE
  - Creating or editing accounting records yourself — that is the bookkeeping agent's job (reading them is IN scope)
  - Sending external communication yourself — that is the comms agent's job
  - Access-control or sharing-permission changes

approval_required:
  - Releasing analysis output to recipients outside CFO Office systems
  - Including customer-level PII detail in any output

data_handling:
  what: Read-only access to the general ledger, tax calculations, and aggregated financial metrics
  rules: Never write; do not cache raw customer records; default to aggregated, de-identified output; do not disclose to third parties; discard intermediate results after the task

operational:
  hours: Mon-Fri 09:00-18:00 America/New_York
  budget_per_task_usd: 0.30
  budget_monthly_usd: 30.00

style: Structured output preferred (JSON or Markdown tables); annotate each figure with its data source and query basis; present an aggregated view by default

lifecycle:
  valid_days: 30
