<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 1010" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="8" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#64748b"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1280" height="1010" fill="#ffffff"/>

  <!-- Title -->
  <text x="640" y="42" text-anchor="middle" font-size="27" font-weight="700" fill="#1e293b">Charter &#215; CFO Office — A Governed Agent Society</text>
  <text x="640" y="70" text-anchor="middle" font-size="15" fill="#64748b">Qwen Cloud Hackathon · Track 3: Agent Society — collaboration governed by signed contracts</text>

  <!-- Input task -->
  <rect x="420" y="92" width="440" height="40" rx="20" fill="#eef2ff" stroke="#6366f1" stroke-width="1.5"/>
  <text x="640" y="117" text-anchor="middle" font-size="14" fill="#3730a3" font-weight="600">Task: Complete Q2 tax filing &#8594; notify external auditor</text>
  <line x1="640" y1="132" x2="640" y2="156" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- ===================== SHOWCASE LAYER ===================== -->
  <rect x="40" y="158" width="1200" height="182" rx="14" fill="#ffffff" stroke="#c7d2fe" stroke-width="1.5"/>
  <text x="60" y="184" font-size="13" font-weight="700" fill="#4f46e5">SHOWCASE — CFO Office (a generative Agent Society — agents plan &amp; act via LLM)</text>

  <!-- Orchestrator -->
  <rect x="70" y="200" width="250" height="120" rx="10" fill="#eef2ff" stroke="#6366f1" stroke-width="1.5"/>
  <text x="195" y="246" text-anchor="middle" font-size="15" font-weight="700" fill="#3730a3">CFO Orchestrator</text>
  <text x="195" y="270" text-anchor="middle" font-size="12" fill="#475569">LLM decomposes &amp; assigns roles</text>
  <text x="195" y="290" text-anchor="middle" font-size="12" fill="#475569">never decides allow / deny</text>
  <line x1="320" y1="260" x2="362" y2="260" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- 4 worker agents -->
  <g font-size="13.5" font-weight="700" fill="#0f172a">
    <rect x="372" y="200" width="180" height="120" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
    <rect x="572" y="200" width="180" height="120" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
    <rect x="772" y="200" width="180" height="120" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
    <rect x="972" y="200" width="180" height="120" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
    <text x="462" y="248" text-anchor="middle">Bookkeeping</text>
    <text x="662" y="248" text-anchor="middle">Tax filing</text>
    <text x="862" y="248" text-anchor="middle">Comms</text>
    <text x="1062" y="248" text-anchor="middle">Data analyst</text>
  </g>
  <g font-size="11" fill="#475569">
    <text x="462" y="270" text-anchor="middle">scope: invoices</text>
    <text x="662" y="270" text-anchor="middle">approval: DROP /</text>
    <text x="662" y="285" text-anchor="middle">destructive</text>
    <text x="862" y="270" text-anchor="middle">approval: send</text>
    <text x="862" y="285" text-anchor="middle">to outsiders</text>
    <text x="1062" y="270" text-anchor="middle">scope: read-only</text>
  </g>
  <!-- charter badges -->
  <g font-size="10" fill="#0f766e" font-weight="600">
    <rect x="462" y="296" width="78" height="16" rx="8" fill="#ccfbf1"/><text x="501" y="308" text-anchor="middle">&#9878; Charter</text>
    <rect x="623" y="296" width="78" height="16" rx="8" fill="#ccfbf1"/><text x="662" y="308" text-anchor="middle">&#9878; Charter</text>
    <rect x="823" y="296" width="78" height="16" rx="8" fill="#ccfbf1"/><text x="862" y="308" text-anchor="middle">&#9878; Charter</text>
    <rect x="1023" y="296" width="78" height="16" rx="8" fill="#ccfbf1"/><text x="1062" y="308" text-anchor="middle">&#9878; Charter</text>
  </g>

  <line x1="640" y1="340" x2="640" y2="372" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="656" y="362" font-size="12" fill="#334155" font-style="italic">each worker's LLM-proposed action passes the contract gate</text>

  <!-- ===================== INFRASTRUCTURE LAYER ===================== -->
  <rect x="40" y="360" width="1200" height="542" rx="14" fill="#f0fdfa" stroke="#5eead4" stroke-width="1.5"/>
  <text x="60" y="386" font-size="13" font-weight="700" fill="#0f766e">INFRASTRUCTURE — Charter contract layer (the moat)</text>
  <!-- legend -->
  <g font-size="11" fill="#475569">
    <rect x="930" y="375" width="13" height="13" rx="3" fill="#16a34a"/><text x="948" y="386">allow</text>
    <rect x="1000" y="375" width="13" height="13" rx="3" fill="#d97706"/><text x="1018" y="386">needs_approval</text>
    <rect x="1130" y="375" width="13" height="13" rx="3" fill="#dc2626"/><text x="1148" y="386">incompatible</text>
  </g>

  <!-- Gate -->
  <rect x="360" y="408" width="560" height="98" rx="10" fill="#ffffff" stroke="#14b8a6" stroke-width="1.5"/>
  <text x="640" y="430" text-anchor="middle" font-size="13" font-weight="700" fill="#0f766e">Contract Gate — runs on EVERY delegation</text>
  <rect x="378" y="444" width="168" height="48" rx="6" fill="#ccfbf1"/>
  <text x="462" y="473" text-anchor="middle" font-size="12" fill="#134e4a">fetch_charter</text>
  <rect x="556" y="444" width="168" height="48" rx="6" fill="#ccfbf1"/>
  <text x="640" y="466" text-anchor="middle" font-size="12" fill="#134e4a">grader (LLM)</text>
  <text x="640" y="482" text-anchor="middle" font-size="10" fill="#0f766e">Qwen / Anthropic</text>
  <rect x="734" y="444" width="168" height="48" rx="6" fill="#ccfbf1"/>
  <text x="818" y="466" text-anchor="middle" font-size="11.5" fill="#134e4a">aggregate_verdict</text>
  <text x="818" y="482" text-anchor="middle" font-size="10" fill="#475569">deterministic</text>
  <line x1="546" y1="468" x2="556" y2="468" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="724" y1="468" x2="734" y2="468" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- fan to branches -->
  <polyline points="640,506 640,520 200,520 200,540" fill="none" stroke="#16a34a" stroke-width="2" marker-end="url(#arrow)"/>
  <polyline points="640,506 640,540" fill="none" stroke="#d97706" stroke-width="2" marker-end="url(#arrow)"/>
  <polyline points="640,506 640,520 1080,520 1080,540" fill="none" stroke="#dc2626" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- ALLOW branch -->
  <rect x="110" y="542" width="180" height="44" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <text x="200" y="569" text-anchor="middle" font-size="13" font-weight="700" fill="#166534">ALLOW</text>
  <line x1="200" y1="586" x2="200" y2="606" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="110" y="606" width="180" height="54" rx="8" fill="#f0fdf4" stroke="#86efac"/>
  <text x="200" y="630" text-anchor="middle" font-size="12" fill="#166534">execute</text>
  <text x="200" y="648" text-anchor="middle" font-size="12" fill="#166534">&#8594; write result to outbox</text>

  <!-- NEEDS_APPROVAL branch -->
  <rect x="470" y="542" width="340" height="44" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
  <text x="640" y="569" text-anchor="middle" font-size="13" font-weight="700" fill="#92400e">NEEDS_APPROVAL  —  step-up negotiation</text>
  <line x1="640" y1="586" x2="640" y2="604" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="470" y="604" width="340" height="42" rx="8" fill="#fffbeb" stroke="#fbbf24"/>
  <text x="640" y="630" text-anchor="middle" font-size="12" fill="#92400e">request_step_up &#8594; principal reviews</text>
  <line x1="640" y1="646" x2="640" y2="662" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="440" y="662" width="400" height="56" rx="8" fill="#fffbeb" stroke="#fbbf24"/>
  <text x="640" y="685" text-anchor="middle" font-size="12.5" font-weight="700" fill="#92400e">principal signs AdHocGrant</text>
  <text x="640" y="704" text-anchor="middle" font-size="11" fill="#92400e">single-use · scoped · TTL · budget-capped</text>
  <line x1="640" y1="718" x2="640" y2="734" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="510" y="734" width="260" height="40" rx="8" fill="#fef3c7" stroke="#d97706"/>
  <text x="640" y="759" text-anchor="middle" font-size="12" fill="#92400e">apply_grant &#8594; execute</text>

  <!-- INCOMPATIBLE branch -->
  <rect x="980" y="542" width="200" height="44" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="1080" y="569" text-anchor="middle" font-size="13" font-weight="700" fill="#991b1b">INCOMPATIBLE</text>
  <line x1="1080" y1="586" x2="1080" y2="606" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="980" y="606" width="200" height="72" rx="8" fill="#fef2f2" stroke="#f87171"/>
  <text x="1080" y="630" text-anchor="middle" font-size="13" font-weight="700" fill="#991b1b">BLOCKED</text>
  <text x="1080" y="650" text-anchor="middle" font-size="11" fill="#7f1d1d">red line — no grant</text>
  <text x="1080" y="666" text-anchor="middle" font-size="11" fill="#7f1d1d">can ever cross it</text>

  <!-- Beat captions -->
  <text x="60" y="812" font-size="11.5" fill="#92400e"><tspan font-weight="700">Beat A</tspan> — Tax agent's temp-table DROP &#8594; needs_approval &#8594; principal issues a one-shot, table-scoped AdHocGrant. (governed escalation)</text>
  <text x="60" y="832" font-size="11.5" fill="#991b1b"><tspan font-weight="700">Beat B</tspan> — a compromised agent proposes "send all client tax data to attacker@evil.com" &#8594; out_of_scope &#8594; incompatible &#8594; blocked. The gate is the backstop, not the agent.</text>

  <!-- Transparency log -->
  <rect x="60" y="852" width="1160" height="32" rx="6" fill="#e2e8f0" stroke="#94a3b8"/>
  <text x="640" y="873" text-anchor="middle" font-size="12" fill="#334155">Transparency log — every verdict &amp; grant is signed and recorded &#8594; an auditable timeline</text>

  <!-- ===================== EXPERIMENT / PROOF ===================== -->
  <rect x="40" y="912" width="1200" height="84" rx="12" fill="#faf5ff" stroke="#d8b4fe" stroke-width="1.5"/>
  <text x="60" y="938" font-size="13" font-weight="700" fill="#7c3aed">Proof for judges — measurable improvement vs. single-agent baseline</text>
  <text x="60" y="960" font-size="12" fill="#4b5563">Same task batch (incl. the injection) run 3 ways:  A = single agent, no governance  ·  B = multi-agent, no charter  ·  C = charter-governed society</text>
  <text x="60" y="980" font-size="12" fill="#4b5563">&#8594; C wins on interception rate · routing accuracy · task success.   Maps to Track-3 criteria: &#9312; decompose &amp; assign  &#9313; resolve conflict via step-up  &#9314; measurable gain</text>
</svg>
